<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korewa Watashi Kazoku Desu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9ece2;
    --paper:#f5f6f0;
    --ink:#2f5a1e;
    --ink-soft:#5d7f45;
    --leaf:#8fbf5f;
    --leaf-dark:#3f7a29;
    --frame:#c9e4a8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:Georgia,"Times New Roman",serif;line-height:1.5;
    min-height:100vh;overflow-x:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  :focus-visible{outline:3px solid var(--ink);outline-offset:3px}

  /* ---------- halaman ---------- */
  .page{
    position:relative;min-height:100vh;overflow:hidden;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:36px 20px;text-align:center;
  }
  .page.active{display:flex;animation:slideIn .6s both}
  @keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  .deco{position:absolute;pointer-events:none}
  .ivy{top:0;left:0;width:min(16%,140px);height:75%}
  .moss{bottom:0;right:0;width:min(32%,300px);height:44%}
  .leaf{
    position:absolute;top:-40px;z-index:1;pointer-events:none;opacity:.75;
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{transform:translate(0,-40px) rotate(0deg)}
    50%{transform:translate(40px,50vh) rotate(180deg)}
    100%{transform:translate(-20px,105vh) rotate(360deg)}
  }

  h1{
    position:relative;z-index:2;
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Trebuchet MS",sans-serif;
    font-weight:900;font-size:clamp(2.2rem,6.4vw,4rem);line-height:1.12;
    color:var(--ink);letter-spacing:1px;
    text-shadow:3px 3px 0 var(--frame),6px 6px 0 rgba(143,191,95,.35);
  }
  h1 .ch{
    display:inline-block;cursor:default;
    animation:letterIn .6s cubic-bezier(.3,1.6,.5,1) both;
    transition:transform .2s,color .2s;
  }
  h1 .ch:hover{transform:translateY(-8px) rotate(-6deg) scale(1.15);color:var(--leaf-dark)}
  h1 .sp{display:inline-block;width:.3em}
  @keyframes letterIn{
    from{opacity:0;transform:translateY(-30px) rotate(-12deg) scale(.6)}
    to{opacity:1;transform:none}
  }
  .sub{
    position:relative;z-index:2;margin-top:10px;color:var(--ink-soft);letter-spacing:4px;
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;font-weight:700;
    font-size:clamp(.95rem,2vw,1.25rem);animation:rise .7s .9s both;
  }

  /* ---------- kartu foto ---------- */
  .grid{
    position:relative;z-index:2;margin-top:22px;
    width:min(100%,max(260px,calc(56vh - 90px)));
    display:grid;grid-template-columns:1fr 1fr;gap:16px 30px;
  }
  .slot{animation:rise .7s both}
  .slot:nth-child(1){animation-delay:.3s}
  .slot:nth-child(2){animation-delay:.42s}
  .slot:nth-child(3){animation-delay:.54s}
  .slot:nth-child(4){animation-delay:.66s}
  .frame{
    display:block;width:100%;aspect-ratio:1/1;padding:9px;
    background:var(--frame);border:2px solid var(--leaf);border-radius:14px;
    box-shadow:0 0 0 3px var(--frame),0 0 0 5px var(--leaf),0 6px 12px rgba(60,90,30,.22);
    transition:transform .25s,box-shadow .25s;cursor:default;
  }
  .slot:nth-child(odd) .frame:hover{transform:translateY(-6px) rotate(-3deg)}
  .slot:nth-child(even) .frame:hover{transform:translateY(-6px) rotate(3deg)}
  .frame:hover{box-shadow:0 0 0 3px var(--frame),0 0 0 5px #6fa63f,0 14px 20px rgba(60,90,30,.3)}
  .inner{
    width:100%;height:100%;background:#fff;overflow:hidden;
    display:flex;align-items:center;justify-content:center;color:#9bb77a;font-size:2.6rem;
  }
  .inner img{width:100%;height:100%;object-fit:cover;display:block}
  .cap{margin-top:10px;font-weight:700;font-size:.95rem}

  /* ---------- tombol ---------- */
  .btn{
    position:relative;z-index:2;display:inline-flex;align-items:center;gap:10px;
    padding:11px 26px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;
    transition:background .2s,transform .2s;
  }
  .btn:hover{background:var(--leaf-dark);transform:translateY(-3px)}
  .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .btn.next{margin-top:26px;animation:rise .7s .8s both}
  .btn.next:hover svg{animation:nudge .6s infinite alternate}
  .btn.back{margin-top:34px;animation:rise .7s 1.4s both}
  .btn.back:hover svg{animation:nudgeL .6s infinite alternate}
  @keyframes nudge{to{transform:translateX(5px)}}
  @keyframes nudgeL{to{transform:translateX(-5px)}}

  /* ---------- halaman jikoshokai ---------- */
  .jiko{
    position:relative;z-index:2;width:100%;max-width:620px;margin-top:26px;
    list-style:none;display:flex;flex-direction:column;gap:14px;
  }
  .jiko li{
    background:var(--paper);border:2px solid var(--frame);border-radius:16px;
    padding:14px 18px;animation:rise .7s both;
    transition:transform .25s,border-color .25s,box-shadow .25s;
  }
  .jiko li:nth-child(1){animation-delay:.35s}
  .jiko li:nth-child(2){animation-delay:.5s}
  .jiko li:nth-child(3){animation-delay:.65s}
  .jiko li:nth-child(4){animation-delay:.8s}
  .jiko li:hover{transform:translateY(-4px);border-color:var(--leaf);box-shadow:0 10px 18px rgba(60,90,30,.16)}
  .jp{font-size:clamp(1.2rem,3vw,1.55rem);font-weight:700}
  .ro{margin-top:2px;font-size:.95rem;letter-spacing:.5px}
  .id{margin-top:4px;padding-top:4px;border-top:1px dashed var(--frame);color:var(--ink-soft);font-style:italic}

  /* ---------- hiasan sisi kiri dan kanan (layar lebar) ---------- */
  .bamboo{
    left:min(12vw,180px);bottom:0;width:min(11vw,150px);height:64%;
    transform-origin:50% 100%;animation:swayB 7s ease-in-out infinite alternate;
  }
  .sakura{
    top:0;right:0;width:min(22vw,300px);
    transform-origin:100% 0;animation:swayS 6s ease-in-out infinite alternate;
  }
  @keyframes swayB{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
  @keyframes swayS{from{transform:rotate(-1.8deg)}to{transform:rotate(1.8deg)}}
  @media (max-width:1100px){.bamboo,.sakura{display:none}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<!-- ===== HALAMAN 1 ===== -->
<main class="page active" id="page1">
  <svg class="deco ivy" viewBox="0 0 160 420" preserveAspectRatio="xMinYMin slice" aria-hidden="true">
    <defs>
      <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#c4dc7a"/><stop offset="1" stop-color="#5c8a2c"/>
      </linearGradient>
      <path id="leaf" d="M0 0 C 18 -6 30 -22 26 -40 C 16 -30 6 -34 0 -48 C -6 -34 -16 -30 -26 -40 C -30 -22 -18 -6 0 0 Z"/>
    </defs>
    <path d="M10 0 C 40 80 20 160 50 260 C 62 310 40 370 56 420" stroke="#5c7a2a" stroke-width="3" fill="none"/>
    <g fill="url(#lg)" stroke="#47701f" stroke-width="1">
      <use href="#leaf" transform="translate(50 40) rotate(70) scale(1.5)"/>
      <use href="#leaf" transform="translate(25 100) rotate(-80) scale(1.3)"/>
      <use href="#leaf" transform="translate(40 165) rotate(80) scale(1.4)"/>
      <use href="#leaf" transform="translate(32 235) rotate(-70) scale(1.2)"/>
      <use href="#leaf" transform="translate(60 295) rotate(75) scale(1.2)"/>
    </g>
  </svg>
  <svg class="deco moss" viewBox="0 0 330 300" preserveAspectRatio="none" aria-hidden="true">
    <path d="M330 20 C 270 80 190 120 150 190 C 120 240 90 270 60 300 L 330 300 Z" fill="#9db37b"/>
    <path d="M330 110 C 280 150 230 190 200 230 C 185 255 170 280 150 300 L 330 300 Z" fill="#87a263" opacity=".7"/>
    <g fill="#f4f6ea"><circle cx="190" cy="265" r="4"/><circle cx="230" cy="283" r="3.5"/><circle cx="270" cy="262" r="4"/><circle cx="310" cy="285" r="3.5"/><circle cx="215" cy="240" r="3"/></g>
  </svg>

  <!-- bunga sakura (dipakai ulang) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="blossom" viewBox="-14 -14 28 28">
        <g fill="#f7c8d4" stroke="#e79ab0" stroke-width=".6">
          <ellipse cx="0" cy="-7" rx="5" ry="7"/>
          <ellipse cx="0" cy="-7" rx="5" ry="7" transform="rotate(72)"/>
          <ellipse cx="0" cy="-7" rx="5" ry="7" transform="rotate(144)"/>
          <ellipse cx="0" cy="-7" rx="5" ry="7" transform="rotate(216)"/>
          <ellipse cx="0" cy="-7" rx="5" ry="7" transform="rotate(288)"/>
        </g>
        <circle r="2.4" fill="#e9748f"/>
      </symbol>
    </defs>
  </svg>

  <!-- bambu di kiri -->
  <svg class="deco bamboo" viewBox="0 0 150 500" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    <defs>
      <linearGradient id="bg" x1="0" x2="1">
        <stop offset="0" stop-color="#6f9f3f"/><stop offset=".5" stop-color="#9ccb63"/><stop offset="1" stop-color="#5f8c34"/>
      </linearGradient>
    </defs>
    <g>
      <rect x="18" y="40" width="14" height="460" rx="5" fill="url(#bg)"/>
      <rect x="64" y="120" width="14" height="380" rx="5" fill="url(#bg)"/>
      <rect x="108" y="80" width="14" height="420" rx="5" fill="url(#bg)"/>
      <g fill="#4a7326">
        <rect x="16" y="110" width="18" height="5" rx="2"/><rect x="16" y="200" width="18" height="5" rx="2"/>
        <rect x="16" y="290" width="18" height="5" rx="2"/><rect x="16" y="380" width="18" height="5" rx="2"/>
        <rect x="62" y="190" width="18" height="5" rx="2"/><rect x="62" y="280" width="18" height="5" rx="2"/>
        <rect x="62" y="370" width="18" height="5" rx="2"/><rect x="62" y="450" width="18" height="5" rx="2"/>
        <rect x="106" y="150" width="18" height="5" rx="2"/><rect x="106" y="240" width="18" height="5" rx="2"/>
        <rect x="106" y="330" width="18" height="5" rx="2"/><rect x="106" y="420" width="18" height="5" rx="2"/>
      </g>
      <g fill="#8dbb4f" stroke="#4a7326" stroke-width=".8">
        <use href="#leaf" transform="translate(32 112) rotate(60) scale(.9)"/>
        <use href="#leaf" transform="translate(18 206) rotate(-65) scale(.9)"/>
        <use href="#leaf" transform="translate(34 292) rotate(70) scale(.8)"/>
        <use href="#leaf" transform="translate(78 192) rotate(60) scale(.9)"/>
        <use href="#leaf" transform="translate(64 282) rotate(-70) scale(.8)"/>
        <use href="#leaf" transform="translate(122 152) rotate(65) scale(.9)"/>
        <use href="#leaf" transform="translate(108 242) rotate(-60) scale(.9)"/>
      </g>
    </g>
  </svg>

  <!-- ranting sakura di kanan atas -->
  <svg class="deco sakura" viewBox="0 0 300 260" aria-hidden="true">
    <g stroke="#7a5a3a" stroke-linecap="round" fill="none">
      <path d="M300 14 C 250 28 205 66 160 82 C 120 96 84 124 36 132" stroke-width="7"/>
      <path d="M205 62 C 192 90 178 120 170 152" stroke-width="4"/>
      <path d="M130 94 C 120 120 102 150 86 170" stroke-width="4"/>
      <path d="M252 30 C 264 62 268 96 264 126" stroke-width="4"/>
    </g>
    <g>
      <use href="#blossom" x="19"  y="115" width="34" height="34"/>
      <use href="#blossom" x="48"  y="112" width="30" height="30"/>
      <use href="#blossom" x="88"  y="98"  width="34" height="34"/>
      <use href="#blossom" x="135" y="68"  width="32" height="32"/>
      <use href="#blossom" x="152" y="135" width="34" height="34"/>
      <use href="#blossom" x="160" y="104" width="28" height="28"/>
      <use href="#blossom" x="68"  y="152" width="34" height="34"/>
      <use href="#blossom" x="86"  y="134" width="26" height="26"/>
      <use href="#blossom" x="246" y="108" width="34" height="34"/>
      <use href="#blossom" x="250" y="80"  width="28" height="28"/>
      <use href="#blossom" x="208" y="36"  width="34" height="34"/>
      <use href="#blossom" x="176" y="52"  width="26" height="26"/>
      <use href="#blossom" x="100" y="76"  width="26" height="26"/>
      <use href="#blossom" x="268" y="8"   width="30" height="30"/>
    </g>
  </svg>

  <h1>Korewa Watashi<br>Kazoku Desu</h1>
  <p class="sub">これはわたしのかぞくです</p>

  <div class="grid" id="grid"></div>

  <button class="btn next" id="next" type="button">
    Jikoshokai
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
</main>

<!-- ===== HALAMAN 2 ===== -->
<main class="page" id="page2">
  <svg class="deco ivy" viewBox="0 0 160 420" preserveAspectRatio="xMinYMin slice" aria-hidden="true">
    <path d="M10 0 C 40 80 20 160 50 260 C 62 310 40 370 56 420" stroke="#5c7a2a" stroke-width="3" fill="none"/>
    <g fill="url(#lg)" stroke="#47701f" stroke-width="1">
      <use href="#leaf" transform="translate(50 40) rotate(70) scale(1.5)"/>
      <use href="#leaf" transform="translate(25 100) rotate(-80) scale(1.3)"/>
      <use href="#leaf" transform="translate(40 165) rotate(80) scale(1.4)"/>
      <use href="#leaf" transform="translate(32 235) rotate(-70) scale(1.2)"/>
      <use href="#leaf" transform="translate(60 295) rotate(75) scale(1.2)"/>
    </g>
  </svg>
  <svg class="deco moss" viewBox="0 0 330 300" preserveAspectRatio="none" aria-hidden="true">
    <path d="M330 20 C 270 80 190 120 150 190 C 120 240 90 270 60 300 L 330 300 Z" fill="#9db37b"/>
    <path d="M330 110 C 280 150 230 190 200 230 C 185 255 170 280 150 300 L 330 300 Z" fill="#87a263" opacity=".7"/>
    <g fill="#f4f6ea"><circle cx="190" cy="265" r="4"/><circle cx="230" cy="283" r="3.5"/><circle cx="270" cy="262" r="4"/><circle cx="310" cy="285" r="3.5"/><circle cx="215" cy="240" r="3"/></g>
  </svg>

  <h1>Jikoshokai</h1>
  <p class="sub">じこしょうかい</p>
  <p class="sub" style="margin-top:2px;letter-spacing:1px;font-style:italic">Perkenalan Diri</p>

  <ul class="jiko" id="jiko"></ul>

  <button class="btn back" id="back" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    Kembali
  </button>
</main>

<script>
  // ====== ATUR FOTO DAN TULISAN DI SINI ======
  // "photo" adalah nama file foto yang ada di folder yang sama dengan index.html.
  // Urutan kartu: Ayah | Ibu, lalu Kakak | Saya.
  const family = [
    { role: 'Ayah',  romaji: 'Chichi',  kana: 'ちち',   photo: 'ayah.jpeg'  },
    { role: 'Ibu',   romaji: 'Haha',    kana: 'はは',   photo: 'ibuk.jpeg'  },
    { role: 'Abang', romaji: 'Ani',     kana: 'あに',   photo: 'abang.jpeg' },
    { role: 'Saya',  romaji: 'Watashi', kana: 'わたし', photo: 'saya.jpeg'  }
  ];
  // Kalimat jikoshokai dan terjemahannya.
  const sentences = [
    { jp: 'これは わたしの かぞくです',           ro: 'Kore wa watashi no kazoku desu',               id: 'Ini adalah keluarga saya.' },
    { jp: 'わたしの かぞくは よにんです',         ro: 'Watashi no kazoku wa yonin desu',              id: 'Keluarga saya ada empat orang.' },
    { jp: 'わたしと ちちと ははと あにひとりです', ro: 'Watashi to chichi to haha to ani hitori desu', id: 'Saya, ayah, ibu, dan satu kakak laki-laki.' },
    { jp: 'わたしは いちばん したです',           ro: 'Watashi wa ichiban shita desu',                id: 'Saya anak paling kecil.' }
  ];
  // ==========================================

  /* ---------- judul: huruf muncul satu per satu ---------- */
  document.querySelectorAll('h1').forEach(h => {
    const full = h.textContent;
    let n = 0;
    [...h.childNodes].forEach(node => {
      if (node.nodeType !== 3) return;
      const frag = document.createDocumentFragment();
      [...node.textContent].forEach(c => {
        if (c === ' ') {
          const sp = document.createElement('span');
          sp.className = 'sp';
          frag.appendChild(sp);
          return;
        }
        const s = document.createElement('span');
        s.className = 'ch';
        s.setAttribute('aria-hidden', 'true');
        s.style.animationDelay = (0.1 + n * 0.045) + 's';
        s.textContent = c;
        frag.appendChild(s);
        n++;
      });
      node.replaceWith(frag);
    });
    h.setAttribute('aria-label', full);
  });

  /* ---------- kartu foto ---------- */
  const grid = document.getElementById('grid');
  family.forEach(member => {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.innerHTML =
      '<div class="frame"><div class="inner">' + member.kana.charAt(0) + '</div></div>' +
      '<div class="cap">' + member.role + ' / ' + member.romaji + ' ' + member.kana + '</div>';
    const inner = slot.querySelector('.inner');
    const img = new Image();
    img.alt = member.role + ' (' + member.kana + ')';
    img.onload = () => { inner.innerHTML = ''; inner.appendChild(img); };
    img.src = member.photo;
    grid.appendChild(slot);
  });

  /* ---------- kalimat jikoshokai ---------- */
  const jiko = document.getElementById('jiko');
  sentences.forEach(s => {
    const li = document.createElement('li');
    li.innerHTML = '<div class="jp">' + s.jp + '</div><div class="ro">' + s.ro + '</div><div class="id">' + s.id + '</div>';
    jiko.appendChild(li);
  });

  /* ---------- pindah halaman ---------- */
  const page1 = document.getElementById('page1');
  const page2 = document.getElementById('page2');
  function show() {
    const second = location.hash === '#jikoshokai';
    page1.classList.toggle('active', !second);
    page2.classList.toggle('active', second);
    window.scrollTo(0, 0);
  }
  document.getElementById('next').addEventListener('click', () => { location.hash = 'jikoshokai'; });
  document.getElementById('back').addEventListener('click', () => { location.hash = ''; });
  window.addEventListener('hashchange', show);
  show();

  /* ---------- daun jatuh ---------- */
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const colors = ['#9bc34a', '#6fa63f', '#b5d36a', '#5c8a2c'];
    // kelopak sakura di halaman pertama
    for (let i = 0; i < 10; i++) {
      const petal = document.createElement('div');
      petal.className = 'leaf';
      petal.style.left = (8 + Math.random() * 84) + '%';
      petal.style.animationDuration = (8 + Math.random() * 8) + 's';
      petal.style.animationDelay = (-Math.random() * 14) + 's';
      petal.innerHTML = '<svg viewBox="-8 -8 16 16" width="14" height="14" aria-hidden="true"><path d="M0 -7 C 6 -6 7 2 0 7 C -7 2 -6 -6 0 -7 Z" fill="#f4b6c6"/></svg>';
      page1.appendChild(petal);
    }
    [page1, page2].forEach(page => {
      for (let i = 0; i < 8; i++) {
        const leaf = document.createElement('div');
        leaf.className = 'leaf';
        leaf.style.left = (6 + Math.random() * 88) + '%';
        leaf.style.animationDuration = (9 + Math.random() * 8) + 's';
        leaf.style.animationDelay = (-Math.random() * 14) + 's';
        leaf.innerHTML = '<svg viewBox="-30 -50 60 55" width="18" height="18" aria-hidden="true"><path d="M0 0 C 18 -6 30 -22 26 -40 C 16 -30 6 -34 0 -48 C -6 -34 -16 -30 -26 -40 C -30 -22 -18 -6 0 0 Z" fill="' + colors[i % colors.length] + '"/></svg>';
        page.appendChild(leaf);
      }
    });
  }
</script>
</body>
</html>
